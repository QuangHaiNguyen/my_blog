<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Hộp đen truyền thống và AI</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="398" rx="16" fill="#fafaf7" stroke="#d8d8d0" stroke-width="2"/>
  <line x1="400" y1="25" x2="400" y2="375" stroke="#d8d8d0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Left: traditional -->
  <text x="200" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#222">Hộp đen truyền thống</text>
  <text x="200" y="68" text-anchor="middle" font-size="15" fill="#666">ví dụ: chiếc xe ô tô</text>

  <g font-size="14" text-anchor="middle">
    <rect x="25" y="110" width="110" height="38" rx="19" fill="#e8e8e2" stroke="#999"/>
    <text x="80" y="134" fill="#222">Đạp ga</text>
    <rect x="25" y="175" width="110" height="38" rx="19" fill="#e8e8e2" stroke="#999"/>
    <text x="80" y="199" fill="#222">Đạp ga</text>
    <rect x="25" y="240" width="110" height="38" rx="19" fill="#e8e8e2" stroke="#999"/>
    <text x="80" y="264" fill="#222">Đạp ga</text>

    <rect x="165" y="100" width="70" height="188" rx="10" fill="#222" stroke="#000" stroke-width="2"/>
    <text x="200" y="205" font-size="36" font-weight="700" fill="#fff">?</text>

    <rect x="265" y="110" width="120" height="38" rx="19" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="325" y="134" fill="#1b5e20">Xe tăng tốc</text>
    <rect x="265" y="175" width="120" height="38" rx="19" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="325" y="199" fill="#1b5e20">Xe tăng tốc</text>
    <rect x="265" y="240" width="120" height="38" rx="19" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="325" y="264" fill="#1b5e20">Xe tăng tốc</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#ar)">
    <line x1="138" y1="129" x2="162" y2="129"/><line x1="138" y1="194" x2="162" y2="194"/><line x1="138" y1="259" x2="162" y2="259"/>
    <line x1="238" y1="129" x2="262" y2="129"/><line x1="238" y1="194" x2="262" y2="194"/><line x1="238" y1="259" x2="262" y2="259"/>
  </g>
  <text x="200" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#2e7d32">Cùng thao tác → luôn cùng kết quả</text>
  <text x="200" y="360" text-anchor="middle" font-size="13" fill="#666">(dự đoán được)</text>

  <!-- Right: AI -->
  <text x="600" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#222">AI</text>
  <text x="600" y="68" text-anchor="middle" font-size="15" fill="#666">ví dụ: chatbot như ChatGPT</text>

  <g font-size="13" text-anchor="middle">
    <rect x="420" y="110" width="130" height="38" rx="19" fill="#e8e8e2" stroke="#999"/>
    <text x="485" y="134" fill="#222">Hỏi cùng một câu</text>
    <rect x="420" y="175" width="130" height="38" rx="19" fill="#e8e8e2" stroke="#999"/>
    <text x="485" y="199" fill="#222">Hỏi cùng một câu</text>
    <rect x="420" y="240" width="130" height="38" rx="19" fill="#e8e8e2" stroke="#999"/>
    <text x="485" y="264" fill="#222">Hỏi cùng một câu</text>

    <rect x="575" y="100" width="70" height="188" rx="10" fill="#222" stroke="#000" stroke-width="2"/>
    <text x="610" y="205" font-size="36" font-weight="700" fill="#fff">?</text>

    <rect x="670" y="110" width="115" height="38" rx="19" fill="#ffe0b2" stroke="#ef6c00"/>
    <text x="727" y="134" fill="#8a3f00">Trả lời A</text>
    <rect x="670" y="175" width="115" height="38" rx="19" fill="#ffcc80" stroke="#ef6c00"/>
    <text x="727" y="199" fill="#8a3f00">Trả lời B</text>
    <rect x="670" y="240" width="115" height="38" rx="19" fill="#ffb74d" stroke="#ef6c00"/>
    <text x="727" y="264" fill="#8a3f00">Trả lời C</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#ar)">
    <line x1="553" y1="129" x2="572" y2="129"/><line x1="553" y1="194" x2="572" y2="194"/><line x1="553" y1="259" x2="572" y2="259"/>
    <line x1="648" y1="129" x2="667" y2="129"/><line x1="648" y1="194" x2="667" y2="194"/><line x1="648" y1="259" x2="667" y2="259"/>
  </g>
  <text x="600" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#c25e00">Cùng câu hỏi → mỗi lần hơi khác</text>
  <text x="600" y="360" text-anchor="middle" font-size="13" fill="#666">(ý thường giống nhau, câu chữ thì thay đổi)</text>
</svg>
