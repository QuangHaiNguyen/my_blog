<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>AI đoán từng mảnh (token) một</title>
  <rect x="1" y="1" width="798" height="378" rx="16" fill="#fafaf7" stroke="#d8d8d0" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#222">AI viết câu trả lời từng mảnh (token) một</text>

  <g font-size="18" text-anchor="middle">
    <!-- Row 1 -->
    <text x="30" y="108" font-size="14" fill="#666">Bước 1</text>
    <rect x="110" y="80" width="80" height="42" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="150" y="108" fill="#0d47a1">Chúc</text>
    <rect x="200" y="80" width="80" height="42" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="240" y="108" fill="#0d47a1">bạn</text>
    <rect x="290" y="80" width="80" height="42" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="330" y="108" fill="#0d47a1">một</text>
    <rect x="380" y="80" width="80" height="42" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="420" y="108" fill="#0d47a1">ngày</text>
    <rect x="470" y="80" width="80" height="42" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5 4"/><text x="510" y="109" font-weight="700" fill="#c25e00">?</text>
    <text x="570" y="108" font-size="14" text-anchor="start" fill="#c25e00">→ đoán: "tốt"</text>

    <!-- Row 2 -->
    <text x="30" y="188" font-size="14" fill="#666">Bước 2</text>
    <rect x="110" y="160" width="80" height="42" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="150" y="188" fill="#0d47a1">Chúc</text>
    <rect x="200" y="160" width="80" height="42" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="240" y="188" fill="#0d47a1">bạn</text>
    <rect x="290" y="160" width="80" height="42" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="330" y="188" fill="#0d47a1">một</text>
    <rect x="380" y="160" width="80" height="42" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="420" y="188" fill="#0d47a1">ngày</text>
    <rect x="470" y="160" width="80" height="42" rx="8" fill="#c8e6c9" stroke="#2e7d32"/><text x="510" y="188" fill="#1b5e20">tốt</text>
    <rect x="560" y="160" width="80" height="42" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5 4"/><text x="600" y="189" font-weight="700" fill="#c25e00">?</text>
    <text x="655" y="188" font-size="14" text-anchor="start" fill="#c25e00">→ "lành"</text>

    <!-- Row 3 -->
    <text x="30" y="268" font-size="14" fill="#666">Bước 3</text>
    <rect x="110" y="240" width="80" height="42" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="150" y="268" fill="#0d47a1">Chúc</text>
    <rect x="200" y="240" width="80" height="42" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="240" y="268" fill="#0d47a1">bạn</text>
    <rect x="290" y="240" width="80" height="42" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="330" y="268" fill="#0d47a1">một</text>
    <rect x="380" y="240" width="80" height="42" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="420" y="268" fill="#0d47a1">ngày</text>
    <rect x="470" y="240" width="80" height="42" rx="8" fill="#c8e6c9" stroke="#2e7d32"/><text x="510" y="268" fill="#1b5e20">tốt</text>
    <rect x="560" y="240" width="80" height="42" rx="8" fill="#c8e6c9" stroke="#2e7d32"/><text x="600" y="268" fill="#1b5e20">lành</text>
    <rect x="650" y="240" width="80" height="42" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5 4"/><text x="690" y="269" font-weight="700" fill="#c25e00">?</text>
  </g>

  <text x="400" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#222">...cứ thế lặp lại cho đến khi hết câu trả lời</text>
  <text x="400" y="355" text-anchor="middle" font-size="12.5" fill="#777">Hình minh họa: cách cắt token thực tế khác nhau tùy từng mô hình</text>
</svg>
